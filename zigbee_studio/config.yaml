name: Zigbee Studio
version: "0.8.3"
slug: zigbee_studio
description: >-
  A fast, live web UI for Zigbee2MQTT, beside its own: devices by floor and room, every setting a
  device has, groups, pairing, firmware, the live log and network health, with the Zigbee
  Sniffer's signal and traffic history, routes, incidents, live frames, the mesh map and floor
  plans with coverage; Zigbee2MQTT's settings, restart, backup, Touchlink and a dev console;
  and a network adapter's (Zigbee Ethernet bridge's) health and traffic.
  Read-only until you allow control.
url: https://github.com/home-controls/zigbee-studio
image: ghcr.io/home-controls/{arch}-zigbee-studio
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:zigbee
panel_title: Zigbee Studio
panel_admin: true
hassio_api: true
homeassistant_api: true
map:
  - share:ro  # the Zigbee Sniffer's read-only key (/share/zigbee_sniffer/studio.key)
options:
  allow_control: false
  z2m_url: ""
  z2m_auth_token: ""
schema:
  allow_control: bool
  z2m_url: str?
  z2m_auth_token: password?
